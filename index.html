<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkora</title>


    <!-- css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/index.css">
    <!-- js -->
    <script defer src="./assets/js/global.js"></script>
    <script defer src="./assets/js/index.js"></script>
</head>

<body class="min-vh-100 d-flex align-items-center flex-column">

    <main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-lg-center">

        <section class="card d-flex flex-column flex-lg-row col-lg-9 py-lg-4">

            <header class="card-hd col-lg-6 d-flex justify-content-center align-items-center flex-column">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-brush">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 21v-4a4 4 0 1 1 4 4h-4" />
                        <path d="M21 3a16 16 0 0 0 -12.8 10.2" />
                        <path d="M21 3a16 16 0 0 1 -10.2 12.8" />
                        <path d="M10.6 9a9 9 0 0 1 4.4 4.4" />
                    </svg>
                </div>

                <h1>
                    Inkora
                </h1>

                <span>El arte fluye aquí</span>
            </header>

            <div id="content" class="content col-lg-6 d-flex flex-column">
                <div class="card-options d-flex gap-2 justify-content-evenly p-1">
                    <div class="selected p-2">
                        <p class="m-0">Iniciar Sesion</p>
                    </div>
                    <div class="p-2">
                        <p class="m-0">Crear una Cuenta</p>
                    </div>
                </div>

                <form class="form d-flex flex-column gap-4">

                    <div class="labels d-flex flex-column gap-2">
                        <label class="" for="email">Usuario</label>
                        <input type="text" name="text" id="usuario" placeholder="Philip" required>
                    </div>

                    <div class="labels d-flex flex-column gap-2">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" id="password" placeholder="Al menos 6 caracteres">
                    </div>

                    <div id="span-error" class="div-error">
                        <div  class="div-error__content">
                            <span>Error usuario o contraseña incorrectos</span>
                        </div>
                    </div>

                    <span>¿Olvidaste tu contraseña?</span>

                    <button class="boton-formulario" id="subLogin" type="submit">Iniciar sesión</button>

                </form>

                <div class="card-continue d-flex align-items-center">
                    <div></div>
                    <p>Continuar con</p>
                    <div></div>
                </div>

                <div class="card-networks align-self-center">
                    <div>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-brand-google">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M20.945 11a9 9 0 1 1 -3.284 -5.997l-2.655 2.392a5.5 5.5 0 1 0 2.119 6.605h-4.125v-3h7.945" />
                        </svg>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <footer>
        <small>
            Inkora © 2026 · Tu arte, tu historia
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

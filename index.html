<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkora</title>


    <!-- css -->
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/index.css">

    <!-- js -->
    <script src="./assets/js/global.js"></script>
    <script src="./assets/js/index.js"></script>
</head>

<body>

    <main class="container">

        <section class="card">

            <header class="card-header">
                <div class="card-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-brush">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 21v-4a4 4 0 1 1 4 4h-4" />
                        <path d="M21 3a16 16 0 0 0 -12.8 10.2" />
                        <path d="M21 3a16 16 0 0 1 -10.2 12.8" />
                        <path d="M10.6 9a9 9 0 0 1 4.4 4.4" />
                    </svg>

                    <h1>
                        Inkora
                    </h1>

                    <p>Donde el arte cobra vida</p>
                </div>

            </header>

            <div class="content">
                <div class="card-options">
                    <div>
                        <p>Iniciar Sesion</p>
                    </div>
                    <div>
                        <p>Crear una Cuenta</p>
                    </div>
                </div>

                <form action="explore.html" method="get">

                    <label for="email"></label>
                    <input type="email" name="email" id="email" placeholder="tu@email.com" required>

                    <label for="password"></label>
                    <input type="password" name="password" id="password" placeholder="Al menos 6 caracteres">

                    <span>¿Olvidaste tu contraseña?</span>

                    <button type="submit">Iniciar sesión</button>

                </form>

                <div class="card-continue">
                    <div></div>
                    <p>Continuar con</p>
                    <div></div>
                </div>
                <div class="card-networks">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-brand-google">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path
                            d="M20.945 11a9 9 0 1 1 -3.284 -5.997l-2.655 2.392a5.5 5.5 0 1 0 2.119 6.605h-4.125v-3h7.945" />
                    </svg>
                </div>
            </div>

        </section>

    </main>

</body>

</html>
